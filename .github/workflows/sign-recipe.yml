name: Sign release recipe
# publish.sh matches its own run by this title before approving it.
run-name: Sign ${{ inputs.tag }}
# Run after recipe.json is attached to a qualified release; clients refuse unsigned recipes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.13)
        required: true
permissions:
  contents: write
jobs:
  sign:
    # Only the reviewed main workflow can sign, and only after an environment reviewer approves the run.
    # The key must be an environment secret of `release` (not a repository secret), so other branches cannot read it.
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.AGENT_CONTEXT_RELEASE_SIGNING_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag"; exit 1; }
          gh release download "$TAG" --pattern recipe.json --dir "$RUNNER_TEMP"
          umask 077; printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          node scripts/sign-recipe.js "$RUNNER_TEMP/recipe.json" "$RUNNER_TEMP/key.pem" > "$RUNNER_TEMP/recipe.json.sig"
          rm -f "$RUNNER_TEMP/key.pem"
          gh release upload "$TAG" "$RUNNER_TEMP/recipe.json.sig" --clobber

[package]
name = "agentq"
version = "0.0.0-dev"
edition = "2024"
publish = false

# The Node package owns src/ until agentq.md § 10 replaces it.
[[bin]]
name = "agentq"
path = "agentq/main.rs"

[dependencies]
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.1.0" }
serde_json = { version = "1", features = ["preserve_order"] }

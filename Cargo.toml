[package]
name = "agentq"
version = "0.0.0-dev"
edition = "2024"
publish = false

[[bin]]
name = "agentq"
path = "agentq/main.rs"

[dependencies]
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.10.0" }
serde_json = { version = "1", features = ["preserve_order"] }
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-headroom"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["headroom-ai[proxy,otel]==0.40.0"]

[project.entry-points."headroom.compressor"]
supercompress = "agent_context_headroom:Supercompress"
